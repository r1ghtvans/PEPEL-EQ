name: Build Pepel EQ (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Pack VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/PepelEQ_artefacts/Release/VST3/Pepel EQ.vst3" "dist/"
          Copy-Item "Assets/OFL-*.txt" "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: Pepel-EQ-VST3
          path: dist
